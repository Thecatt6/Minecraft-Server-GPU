plugins {
	// Minecraft 26.1+ non è offuscato: si usa il plugin Loom "non-remapping".
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.name
}

repositories {
	// Nessun repository extra: Loom aggiunge Fabric, Mojang e Maven Central automaticamente.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// OpenCL per la GPU (es. NVIDIA MX130). Incluso nel jar del mod (jar-in-jar).
	implementation "org.jocl:jocl:${project.jocl_version}"
	include "org.jocl:jocl:${project.jocl_version}"
}

// Niente riferimenti a "project" dentro i closure: incompatibili con il configuration cache.
def modVersion = project.version
def modName = project.name

processResources {
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", modName
	from("LICENSE") {
		rename { "${it}_${modName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
